<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify Certificate — Royalty Nexus</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/certificate.css">
</head>
<body>
  <header class="site-nav solid">
    <a class="brand" href="index.html"><img src="assets/favicon.svg" alt="" width="34" height="34"><span>Royalty <em>Nexus</em></span></a>
    <nav class="nav-links simple"><a href="index.html#campaigns">Campaigns</a></nav>
  </header>

  <section class="page-banner">
    <div class="scene scene-morning" aria-hidden="true">
      <div class="sky"></div>
      <div class="sun" data-speed="-0.2"><span></span></div>
      <svg class="layer layer-far" data-speed="0.4" viewBox="0 0 1440 600" preserveAspectRatio="none"><path fill="#c3cfd9" d="M0 600V330l90-40 80 20 90-90 80 40 80-80 80 60 80-40 80 70 100-120 100 80 80-30 80 60 100-90 80 60 90-30 80 50 70-20v370z"/></svg>
      <svg class="layer layer-mid" data-speed="0.25" viewBox="0 0 1440 600" preserveAspectRatio="none"><path fill="#8aa59f" d="M0 600V380q120-80 220-40t200-20q100-60 220 10t220-30q120-60 240 20t220-20q70-10 120 20v280z"/></svg>
      <svg class="layer layer-hills" data-speed="0.1" viewBox="0 0 1440 600" preserveAspectRatio="none"><path fill="#2d5a40" d="M0 600V440c200-50 320 20 520-20s340-40 480 10 300-30 440 0v170z"/></svg>
    </div>
    <div class="page-banner-title">
      <p class="eyebrow" style="color:#fff">Certificate registry</p>
      <h1>Verify a certificate</h1>
    </div>
  </section>

  <main class="page-body">
    <div class="container">
      <div class="card" style="max-width:720px;margin:0 auto">
        <form class="verify-form" id="verifyForm" style="max-width:none">
          <label class="sr-only" for="certId">Certificate ID</label>
          <input id="certId" name="id" placeholder="Enter certificate ID, e.g. RN-2026-7K3PQA" required style="background:#fff;color:var(--ink);border-color:#cfd6c8">
          <button class="btn btn-leaf" type="submit">Verify</button>
        </form>
      </div>
      <div class="verify-result" id="result" aria-live="polite"></div>
    </div>
  </main>

  <footer class="site-footer" style="padding-top:30px">
    <p class="container copyright" style="margin-top:0;border:0">© <span id="year"></span> Royalty Nexus Foundation Trust</p>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/scene.js"></script>
  <script>
    (function () {
      const form = document.getElementById('verifyForm');
      const input = document.getElementById('certId');
      const result = document.getElementById('result');
      document.getElementById('year').textContent = new Date().getFullYear();

      function check(id) {
        const cert = RN.certificate(id);
        if (!cert) {
          result.innerHTML = '<div class="card" style="max-width:720px;margin:0 auto;text-align:center">' +
            '<span class="status-pill invalid">✕ Not found</span>' +
            '<p>No certificate with ID <strong>' + RN.esc(id.toUpperCase()) + '</strong> exists in the registry. Check the ID and try again.</p></div>';
          return;
        }
        const status = cert.revoked
          ? '<span class="status-pill invalid">✕ This certificate was revoked on ' + RN.esc(RN.fmtDate(cert.revokedAt)) + '</span>'
          : '<span class="status-pill valid">✓ Valid certificate issued to ' + RN.esc(cert.name) + '</span>';
        result.innerHTML = '<div style="text-align:center">' + status + '</div>' +
          '<div class="print-area">' + RN.certificateHTML(cert) + '</div>' +
          (cert.revoked ? '' : '<div class="actions"><button class="btn btn-leaf" onclick="window.print()">Print / Save as PDF</button></div>');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const id = input.value.trim();
        if (!id) return;
        history.replaceState(null, '', '?id=' + encodeURIComponent(id.toUpperCase()));
        check(id);
      });

      RN.ready.then(function () {
        const id = new URLSearchParams(location.search).get('id');
        if (id) { input.value = id.toUpperCase(); check(id); }
      });
    })();
  </script>
</body>
</html>
